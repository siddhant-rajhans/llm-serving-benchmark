[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "llm-serving-benchmark"
version = "0.1.0"
description = "Benchmark vLLM vs SGLang: latency, throughput, and cost per million tokens under realistic traffic patterns"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Siddhant Rajhans", email = "sidjha88@gmail.com" }]

dependencies = [
    "vllm>=0.6.0",
    "sglang[all]>=0.4.0",
    "locust>=2.29",
    "prometheus-client>=0.21",
    "pandas>=2.2",
    "matplotlib>=3.9",
    "click>=8.1",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "numpy>=1.26",
    "rich>=13.7",
    "tabulate>=0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[project.scripts]
llm-bench = "benchmark.cli:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/benchmark"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py310"
line-length = 100
